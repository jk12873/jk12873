<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="cyanGlow" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .name-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.5px; fill: url(#textGrad); }
    .role-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #94a3b8; }
    .role-highlight { fill: #38bdf8; font-weight: 700; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
    .org-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
    .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Background Box -->
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#purpleGlow)" />

  <!-- Top Status Pill -->
  <rect x="36" y="26" width="220" height="26" rx="13" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="50" cy="39" r="4" fill="#10b981" />
  <text x="62" y="43" class="pill-text">ENTERPRISE SDE • 4+ YRS</text>

  <!-- Org / Location -->
  <text x="964" y="44" text-anchor="end" class="org-text">Accenture • Bengaluru, India</text>

  <!-- Main Name -->
  <text x="36" y="105" class="name-text">Jatin Kumar</text>

  <!-- Subtitle / Role -->
  <text x="36" y="137" class="role-text">Software Development Engineer | <tspan class="role-highlight">Java Backend &amp; Distributed Systems</tspan></text>

  <!-- Skill Badges Bottom Row -->
  <!-- Tag 1 -->
  <rect x="36" y="162" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="88" y="180" text-anchor="middle" class="tag-text">☕ Java 21+</text>

  <!-- Tag 2 -->
  <rect x="149" y="162" width="135" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="216" y="180" text-anchor="middle" class="tag-text">🍃 Spring Boot 3</text>

  <!-- Tag 3 -->
  <rect x="292" y="162" width="135" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="359" y="180" text-anchor="middle" class="tag-text">⚡ Apache Kafka</text>

  <!-- Tag 4 -->
  <rect x="435" y="162" width="155" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="512" y="180" text-anchor="middle" class="tag-text">🗄️ Oracle &amp; MySQL</text>

  <!-- Tag 5 -->
  <rect x="598" y="162" width="150" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="673" y="180" text-anchor="middle" class="tag-text">🤖 Spring AI &amp; LLMs</text>

  <!-- Tag 6 -->
  <rect x="756" y="162" width="115" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="813" y="180" text-anchor="middle" class="tag-text">☁️ AWS Cloud</text>

  <!-- Tag 7 -->
  <rect x="879" y="162" width="85" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="921" y="180" text-anchor="middle" class="tag-text">♿ WCAG</text>
</svg>
